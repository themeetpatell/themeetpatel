        <h1>What is your business already telling you?</h1>
        <p>Company 8 is building Dan — the autonomous decision intelligence layer that connects a company’s systems, reconciles conflicting data, and tells the people who run it what changed, why it matters, and what to do next. Meet Patel (themeetpatel) is the founder — a Dubai-based operator who has built and scaled 10+ ventures across AI, fintech, hardware, and software.</p>
        <p><em>Which Meet Patel:</em> The Meet Patel who founded Company 8 and builds Dan (usedan.com) in Dubai, UAE — handle themeetpatel / @the_meetpatel. Not to be confused with other people named Meet Patel.</p>
        <h2>The layer that decides what deserves attention.</h2>
        <p>By the time leadership sees the risk, the business has already paid for it. The CRM, the dashboard and finance each report a different number, and a person still has to reconcile the truth across tools, dashboards and spreadsheets — after the signal has already become costly.</p>
        <ul>
          <li>Reconciles before it reports — The CRM, the dashboard and finance rarely agree. Dan connects them, reconciles the conflict, and settles which number is right before anyone walks into the meeting.</li>
          <li>Investigates without being asked — Material risks and opportunities are surfaced before someone remembers to look. Agents audit, monitor and publish findings on a schedule.</li>
          <li>Shows the work, then stays on it — Every finding carries the evidence, business definition, source lineage and confidence needed to defend the decision — and Dan keeps watching the same signal after the call.</li>
        </ul>
        <h2>Why now</h2>
        <p>AI made answers cheap. Acting on the wrong answer became expensive. The valuable layer is no longer producing an answer — it is deciding what to trust, what to do about it, and whether it worked.</p>
        <h2>Why this founder</h2>
        <p>I spent years as the human &quot;Dan&quot; — the operator who had to notice what was moving in the business, work out why, and say what to do about it. As interim COO, then Head of COE and now Associate Vice President, I helped scale Finanshels from 17 to 192 people, and from 105 to over 7,000 SMEs served. I lived the problem Dan solves. Now I am going all-in on building it.</p>
        <p>Previously built and scaled ventures across edtech, hardware, and fintech.</p>
        <ul>
          <li>TorchIt — Assistive-tech hardware, scaled production</li>
          <li>Incsmart — Energy venture, exited</li>
        </ul>
        <h2>Company 8 is raising pre-seed</h2>
        <p>Backing an operator-founder building the decision layer between a business and its own answers — the layer that says which number is right, what changed, and what to do about it.</p>
        <p>Dan is live at https://usedan.com, with 43 weekly active users in the last 30 days in the first 10 weeks, at zero paid acquisition. Launched on Product Hunt.</p>
        <p>Figures as of 29 August 2026, read from the Company 8 pre-seed deck (slide 12), covering the first 10 weeks at zero paid acquisition. Not restated as current.</p>
        <p>Investor contact: meet@company8.dev · https://www.themeetpatel.com/investors</p>

        <h2>Frequently asked questions</h2>
        <h3>Who is Meet Patel?</h3>
        <p>Me. Meet Patel — a founder and operator based in Dubai, UAE. I founded Company 8 and I’m building Dan. Before that: 8+ years, 10+ ventures across AI, fintech, hardware and software, and 490+ people who reported to me.</p>
        <h3>Which Meet Patel is this?</h3>
        <p>The one in Dubai, UAE who founded Company 8. Also written The Meet Patel; the handle is themeetpatel, or @the_meetpatel. There are a great many of us and we are not affiliated.</p>
        <h3>What is Dan?</h3>
        <p>Dan (usedan.com) is what Company 8 is building. It connects the systems you already run, decides which conflicting number is actually right, and tells you what changed, why it matters and what to do next. It doesn’t wait to be asked — monitoring is what starts the investigation, every finding arrives with its evidence, and Dan keeps watching that same signal after you’ve made the call.</p>
        <h3>What is Company 8?</h3>
        <p>Company 8 is the autonomous decision intelligence company I founded in Dubai, UAE in 2025. It builds Dan (usedan.com), which connects a company’s systems, reconciles where they disagree, and tells the team what changed, why it matters and what to do next. Company 8 is raising a pre-seed round, which is the polite phrase for “I would like to talk to you”.</p>
        <h3>What does Meet Patel believe about AI and companies?</h3>
        <p>The scarce resource inside a modern company is organizational attention. Companies have built systems for storing information, systems for visualising it, and now systems for querying it. What they still have not built is a system responsible for noticing what deserves management attention. That layer is what becomes interesting over the next decade. The unabridged and slightly more argumentative version is at https://www.themeetpatel.com/thesis.</p>
        <h3>What companies has Meet Patel built?</h3>
        <p>Company 8 is the current one, building Dan. Before it: 10+ ventures — BiggDate, BiggMate, ZeroHuman, MealVerse, StudentHub and TorchIt — across AI, fintech, edtech, hardware and software. Some exited, some closed, and all of them are still listed at https://www.themeetpatel.com/portfolio, because a portfolio with only the wins on it is a brochure.</p>
        <h3>Where is Meet Patel based?</h3>
        <p>Dubai, UAE — where I build and scale startups, and spend a slightly unreasonable amount of time on the wider startup ecosystem.</p>
        <h3>How can I contact Meet Patel?</h3>
        <p>Email meet@company8.dev, book time at https://calendar.app.google/Cc1ugo4Ffx5bqguP9, use the form at https://www.themeetpatel.com/contact, or find me on LinkedIn at linkedin.com/in/themeetpatel. Founders, investors and “this is broken and I don’t know why” all reach the same inbox, and I read it myself.</p>
