    <!-- ─────────────────────────────────────────────────────────────────────
         SEO META TAGS LIVE IN src/components/SEOHead.jsx — NOT HERE.
         react-helmet-async can only replace tags it created, so any SEO tag
         duplicated in this shell renders TWICE in the DOM (verified: two
         conflicting <link rel="canonical"> told Google every interior page
         was a duplicate of the homepage). Only the <title> is safe, because
         the browser keeps a single title element.
         Crawlers that don't run JS are served fully-rendered HTML by
         api/page.js and api/og.js — see the bot rewrites in vercel.json.
         ───────────────────────────────────────────────────────────────────── -->

    <meta name="geo.position" content="25.2048;55.2708" />
    <meta name="ICBM" content="25.2048, 55.2708" />
